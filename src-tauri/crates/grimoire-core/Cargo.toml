[package]
name = "grimoire-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"
description = "UI-neutral product contracts and services for Grimoire clients"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.23"
walkdir = "2.5"

[dev-dependencies]
