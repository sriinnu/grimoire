name: Dev Build

# On-demand unsigned installers for checking the app on macOS and Windows.
# Unlike release.yml, this needs no signing secrets: it disables updater
# artifacts (createUpdaterArtifacts) so `tauri build` doesn't require the Tauri
# signing key, and it skips Apple notarization. The resulting installers are
# unsigned — fine for local testing (macOS: right-click → Open the first time).
# Dispatch it against any branch to check that branch's build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon, unsigned)
    runs-on: macos-15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable as of 2026-09-29
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (unsigned, no updater artifacts)
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: grimoire-macos-unsigned
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64 (unsigned)
    runs-on: windows-2025-vs2026
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable as of 2026-09-29
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (unsigned, no updater artifacts)
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: grimoire-windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
