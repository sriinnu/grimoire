name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test, And Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025-vs2026]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install Linux Tauri Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev xvfb

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable as of 2026-09-29
        with:
          components: clippy,rustfmt

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Local-Only Audit Guard
        run: pnpm test:local-only-audit

      - name: Local-Only Audit
        run: pnpm audit:local-only

      - name: Verify Rust Platform Guard
        run: pnpm test:rust-platform-guards:self

      - name: Rust Platform Guard
        run: pnpm test:rust-platform-guards

      - name: Verify Release Artifact Guard
        run: pnpm test:release-artifacts

      - name: Verify Release Pages Guard
        run: pnpm test:release-pages

      - name: Verify Release Secrets Handoff
        run: pnpm test:release-secrets

      - name: Verify GitHub Actions Runtime Guard
        run: pnpm test:github-actions-runtime

      - name: Verify Public Doc Links
        run: pnpm test:public-doc-links

      - name: Verify Starter Vault Showcase
        run: pnpm test:starter-vault

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # The native smokes below run a bare `cargo build`, which does not invoke
      # the Tauri `beforeBuildCommand`. tauri.conf.json declares
      # `resources/starter-vault` as a required bundle resource, and that
      # directory is generated (gitignored) rather than tracked, so a cold CI
      # checkout must materialize it before the build script validates resources.
      - name: Bundle Native Resources
        run: pnpm bundle-starter-vault

      - name: Native Tauri Link Smoke
        timeout-minutes: 25
        run: pnpm test:native-tauri-link

      - name: Native Tauri Startup Smoke
        timeout-minutes: 15
        run: pnpm test:native-tauri-startup

      - name: Frontend Tests
        timeout-minutes: 20
        run: pnpm test --silent

      - name: Markdown Editor Parity JS
        timeout-minutes: 10
        run: pnpm test:markdown-editor:js

      - name: Markdown Editor Parity Swift
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: pnpm test:markdown-editor:swift

      - name: Product Contract Parity JS
        timeout-minutes: 10
        run: pnpm test:product-contracts:js

      - name: Product Contract Parity Swift
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: pnpm test:product-contracts:swift

      - name: Native Apple Shell Build
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: pnpm test:native-apple-build

      - name: Native Apple Shell Tests
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: pnpm test:native-apple-unit

      - name: Native iOS Compile Guard
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: pnpm test:native-ios-build

      - name: Install Playwright Browsers
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: pnpm exec playwright install chromium webkit

      - name: Browser Smoke Chromium
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: PLAYWRIGHT_BROWSERS=chromium PLAYWRIGHT_REPORTER=line pnpm playwright:smoke

      - name: Browser Smoke WebKit Core
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: >
          PLAYWRIGHT_BROWSERS=webkit PLAYWRIGHT_REPORTER=line pnpm exec playwright test
          --config playwright.smoke.config.ts
          tests/smoke/example.spec.ts

      - name: Rust Lint
        timeout-minutes: 20
        run: |
          cargo clippy --manifest-path=src-tauri/Cargo.toml -- -D warnings
          cargo fmt --manifest-path=src-tauri/Cargo.toml -- --check
