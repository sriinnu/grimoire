name: Deploy Browser Demo

# Publishes the browser build of Grimoire to GitHub Pages as a live, playable
# demo. The production build runs in mock-Tauri mode in a plain browser, so the
# static bundle is a self-contained Grimoire pre-loaded with demo content — no
# install, no backend. Served under the project-pages subpath via
# GRIMOIRE_BASE_PATH=/grimoire/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy browser demo
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build browser demo
        env:
          GRIMOIRE_BASE_PATH: /grimoire/
          # The demo has no native backend: production build must keep its
          # mock-Tauri fixtures or the app soft-bricks on first settings read.
          VITE_GRIMOIRE_BROWSER_DEMO: "1"
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
